<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Button Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #0a0a0a;
      color: #f5f5f5;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .pass {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
    }
    .fail {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
    }
    button {
      padding: 8px 16px;
      margin: 10px 5px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Admin Panel "Add Entry" Button Diagnostic</h1>

  <div id="results"></div>

  <h2>Interactive Test:</h2>
  <button data-action="add-list-item" data-path="test.items" data-template="%7B%22label%22%3A%22%22%2C%22detail%22%3A%22%22%2C%22url%22%3A%22%22%7D">
    Add Entry (Test Button)
  </button>
  <div id="list-state"></div>

  <script>
    const results = document.getElementById('results');
    const listState = document.getElementById('list-state');

    // Mock state for testing
    const state = {
      content: {
        test: {
          items: []
        }
      }
    };

    function addResult(testName, passed, message) {
      const div = document.createElement('div');
      div.className = `test-result ${passed ? 'pass' : 'fail'}`;
      div.textContent = `${passed ? '✓' : '✗'} ${testName}: ${message}`;
      results.appendChild(div);
    }

    function updateListDisplay() {
      listState.innerHTML = '<pre>Items: ' + JSON.stringify(state.content.test.items, null, 2) + '</pre>';
    }

    // Test 1: Check if button has proper attributes
    const button = document.querySelector('[data-action="add-list-item"]');
    addResult('Button exists', !!button, button ? 'Found button with data-action' : 'Button not found');

    if (button) {
      addResult('Has data-path', !!button.dataset.path, button.dataset.path || 'Missing');
      addResult('Has data-template', !!button.dataset.template, button.dataset.template ? 'Present' : 'Missing');

      // Test 2: Template decoding
      try {
        const decoded = JSON.parse(decodeURIComponent(button.dataset.template));
        addResult('Template decodes', true, JSON.stringify(decoded));
      } catch(e) {
        addResult('Template decodes', false, e.message);
      }
    }

    // Test 3: Event handler
    document.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;
      addResult('Click detected', true, `Action: ${action}`);

      if (action === 'add-list-item') {
        try {
          const template = JSON.parse(decodeURIComponent(btn.dataset.template));
          state.content.test.items.push(template);
          addResult('Item added', true, `Total items: ${state.content.test.items.length}`);
          updateListDisplay();
        } catch(e) {
          addResult('Item added', false, e.message);
        }
      }
    });

    updateListDisplay();

    addResult('Event listener', true, 'Click handler registered');
  </script>
</body>
</html>

    intro: |-
      In this section you will find all available classes.
      Explore detailed descriptions so you can explore, understand and guide you in your choice.
  - type: text-columns
    title: What to Expect
    columns:
      - label: Class Size
        body: Maximum 6 students per workshop. Enough space to spread out, enough intimacy for real conversation and individual feedback.
      - label: What's Included
        body: |-
          All ingredients and equipment will be provided. Printed recipes and pastries you made to take home : don't forget to bring a box to transport them safely.
          Japanese tea service during class with sweets to share.
      - label: Location
        body: "[Describe your teaching space: e.g., 'My home studio in [neighborhood], Oakland. Street parking available. Accessible entrance — please message ahead if you need accommodations.']"
  - type: contact
    title: Questions About Classes?
    body: Not sure which class is right for you? Curious about private lessons or group bookings for special occasions? I'm happy to help you find the right fit.
    email: emilie.mchl@gmail.com

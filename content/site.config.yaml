# Site Configuration for Japanese Pastry Chef & Educator
# Inspired by: Kaori Ishibashi, Fumiko Kono, Niki Nakayama, Sadaharu Aoki

siteTitle: "[Your Name] — Japanese Pastry & Wagashi"
siteDescription: "[A one-sentence description of your practice: e.g., 'Teaching the art of Japanese confectionery through intimate workshops and seasonal pastry boxes shipped nationwide.']"
baseUrl: https://okashi-school.com
favicon: /assets/favicon.svg

theme:
  mode: light
  background: "#faf8f5"
  foreground: "#2d2926"
  accent: "#c4a77d"
  muted: "#8b8178"
  borderSubtle: rgba(45,41,38,0.08)
  typography:
    displaySans: "'Cormorant Garamond', 'Noto Serif JP', georgia, serif"
    bodySans: "'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif"
    accentSerif: "'Cormorant Garamond', 'Noto Serif JP', georgia, serif"
  density: airy

navigation:
  - label: Classes
    href: /classes
  - label: Signature Course
    href: /signature-course
  - label: Journal
    href: /journal
  - label: Shop
    href: /shop
  - label: Contact
    href: /contact

socialLinks:
  - label: Instagram
    href: https://instagram.com/[your_handle]
  - label: YouTube
    href: https://youtube.com/@[your_channel]
  - label: Newsletter
    href: /contact#newsletter

deploy:
  endpoint: https://deploy.example.com/hooks/site
  method: POST
  authHeader: Bearer PLACEHOLDER_TOKEN

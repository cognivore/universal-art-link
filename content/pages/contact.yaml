# Contact Page for Japanese Pastry Chef & Educator
# Inspired by: Kaori Ishibashi, Fumiko Kono, Niki Nakayama, Sadaharu Aoki

slug: /contact
title: Contact
layout: default

sections:
  - type: hero
    kicker: Get in Touch
    title: "[Your availability statement, e.g., 'Currently booking classes for Spring 2026.']"
    subtitle: "[Describe what you're available for: e.g., 'Workshop inquiries, private lesson requests, bulk orders for events, or just to say hello — I read every message and respond within 48 hours.']"
    body: |+
      [Optional: Add any special notes about your current availability, such as:
      - 'Private lessons available Tuesday-Thursday'
      - 'Shop orders ship every Friday'
      - 'Currently on waitlist for group workshops until April']

  - type: text-columns
    title: Ways to Connect
    columns:
      - label: Class Inquiries
        body: "[Describe how to book or inquire about classes: e.g., 'Use the form below or email directly. Include which class interests you and any dietary restrictions. I'll follow up with available dates and payment details.']"
      - label: Private Lessons
        body: "[Describe private lesson options: e.g., 'One-on-one or small group sessions tailored to your goals. Perfect for special occasions, skill-building, or exploring techniques not covered in regular workshops. Minimum 2-hour booking.']"
      - label: Special Orders
        body: "[Describe custom/bulk orders: e.g., 'Pastry boxes for events, wedding favors, corporate gifts. Minimum 2-week lead time required. Pricing depends on selection and quantity — reach out with details for a quote.']"

  - type: list-section
    title: "[Section title, e.g., 'Quick Answers']"
    items:
      - label: "[FAQ question, e.g., 'Do you ship pastries?']"
        detail: "[Answer: e.g., 'Yes! Weekly shipments every Friday. See the Shop for current availability and shipping zones.']"
      - label: "[FAQ question, e.g., 'I'm a complete beginner — is that okay?']"
        detail: "[Answer: e.g., 'Absolutely. Most of my students start with zero pastry experience. Patience matters more than skill.']"
      - label: "[FAQ question, e.g., 'Can I book a class as a gift?']"
        detail: "[Answer: e.g., 'Yes — gift certificates available for any class. Email me with the recipient's name and preferred class type.']"
      - label: "[FAQ question, e.g., 'Do you accommodate dietary restrictions?']"
        detail: "[Answer: e.g., 'Some classes can be adapted for gluten-free or vegan. Let me know when booking and I'll advise what's possible.']"

  - type: contact
    title: Send a Message
    body: "[Form introduction: e.g., 'Whether it's a class question, a collaboration idea, or feedback on a recipe from the journal — I'd love to hear from you.']"
    email: hello@example.com
    formAction: https://formspree.io/f/[your-form-id]

# Classes Index Page for Japanese Pastry Chef & Educator
# Inspired by: Kaori Ishibashi, Fumiko Kono, Niki Nakayama, Sadaharu Aoki

slug: /classes
title: Classes & Workshops
layout: index-grid

sections:
  - type: hero
    kicker: Learn
    title: "[Your teaching tagline, e.g., 'Hands-on workshops for curious home bakers.']"
    subtitle: "[Describe your class offerings overview: e.g., 'Small groups, generous instruction, and pastries to take home. All skill levels welcome — patience and curiosity required.']"

  - type: projects-grid
    title: Current Schedule
    projects:
      - title: "[Signature Course Name, e.g., 'Foundations of Wagashi']"
        role: "[Format & duration, e.g., '4-Week Intensive']"
        year: "[Season/dates, e.g., 'Spring 2026']"
        coverImage:
          src: /assets/project-orbit.svg
          alt: "[Describe: e.g., 'Seasonal nerikiri shaped like cherry blossoms']"
        slug: /foundations-of-wagashi
        span: wide

      - title: "[Japanese Bakery Class, e.g., 'Japanese Bakery Essentials']"
        role: "[Format, e.g., '3-Session Series']"
        year: "[Dates, e.g., 'Monthly']"
        coverImage:
          src: /assets/project-dawn.svg
          alt: "[Describe: e.g., 'Assortment of Japanese breads — melon pan, anpan, shokupan']"
        slug: /classes#bakery-essentials

      - title: "[Specialty Class, e.g., 'Seasonal Mochi Workshop']"
        role: "[Format, e.g., 'Single-Day Workshop']"
        year: "[Frequency, e.g., 'Quarterly']"
        coverImage:
          src: /assets/project-resonant.svg
          alt: "[Describe: e.g., 'Daifuku mochi with strawberry filling']"
        slug: /classes#mochi-workshop
        span: tall

      - title: "[Advanced Class, e.g., 'French-Japanese Fusion Pastry']"
        role: "[Format, e.g., 'Advanced Workshop']"
        year: "[Prerequisites note, e.g., 'By application']"
        coverImage:
          src: /assets/project-elan.svg
          alt: "[Describe: e.g., 'Matcha opera cake with gold leaf']"
        slug: /classes#fusion-pastry

      - title: "[Private Option, e.g., 'Private Lessons']"
        role: "[Format, e.g., 'One-on-One or Small Group']"
        year: "[Availability, e.g., 'Year-round']"
        coverImage:
          src: /assets/project-signal.svg
          alt: "[Describe: e.g., 'Close-up of hands piping decorations']"
        slug: /contact#private-lessons

  - type: text-columns
    title: What to Expect
    columns:
      - label: Class Size
        body: "[Describe your class size philosophy: e.g., 'Maximum 6 students per workshop. Enough space to spread out, enough intimacy for real conversation and individual feedback.']"
      - label: What's Included
        body: "[List inclusions: e.g., 'All ingredients and equipment provided. Printed recipes to take home. Pastries you made (and extras to share). Tea service during class.']"
      - label: Location
        body: "[Describe your teaching space: e.g., 'My home studio in [neighborhood], Oakland. Street parking available. Accessible entrance — please message ahead if you need accommodations.']"

  - type: list-section
    title: Upcoming Dates
    items:
      - label: "[Class Name]"
        detail: "[Date & time, e.g., 'Saturday, March 15 — 10am-2pm — 2 spots remaining']"
      - label: "[Class Name]"
        detail: "[Date & time, e.g., 'Saturday, March 22 — 10am-2pm — Waitlist']"
      - label: "[Class Name]"
        detail: "[Date & time, e.g., 'Saturday, April 5 — 10am-2pm — Open']"
      - label: "[Class Name]"
        detail: "[Date & time, e.g., 'Sunday, April 6 — 2pm-5pm — Open']"

  - type: contact
    title: Questions About Classes?
    body: "[Invite inquiries: e.g., 'Not sure which class is right for you? Curious about private lessons or group bookings for special occasions? I'm happy to help you find the right fit.']"
    email: "[your-email]@[domain].com"
